name: Publish PID Tuner v0.5.24

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.24.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RC_ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d7ac-8210-abe1-42b24347ab5a/raw?se=2026-09-11T07%3A09%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=2d51d2e1-49f1-50f5-89f9-6ba3f9063350&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T05%3A09%3A26Z&ske=2026-09-12T05%3A09%3A26Z&sks=b&skv=2026-02-06&sig=K973fjKGpD5WKO5CG0byg5LB8zb4trM9IOM1ABELeAw%3D"
      EXPECTED_SHA256: "bd2456a7581b8e601d7af4d4598ec941e107bd990f42553d5fa435bb6846d120"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public release JAR
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$RC_ARTIFACT_URL" -o rc-source.zip
          unzip -q rc-source.zip
          python3 <<'PY'
          from pathlib import Path
          import struct, zipfile

          srcjar=Path("pid-autotune-plugin-0.5.24-HARDENED-RC1.jar")
          outjar=Path("pid-autotune-plugin-0.5.24.jar")
          old_ver=b"0.5.24-HARDENED-RC1"
          new_ver=b"0.5.24"
          old_desc=("EPICEFI PID workspace with task-based Guided and audited RAM-only Autonomous workflows for DC-IAC and Idle Closed Loop. "
                    "0.5.24-HARDENED-RC1 carries the consolidated 0.5.23 behavior forward with stale-telemetry rejection, locale-safe gain CSV round-tripping, "
                    "corrected live Reset/archive lifecycle, ECU-configuration and effective-capture-setting comparison scoping, off-EDT CSV export, event-driven recommendation refresh, "
                    "and reproducible builds. Guided task order remains user-authoritative. Autonomous retains bounded excitation, exact RAM readback/rollback, and no automatic Burn. "
                    "This RC is a current-source validation candidate and is not the immutable vehicle-tested 0.5.23 seed artifact.").encode()
          new_desc=("EPICEFI PID tuning workspace with task-based Guided and audited RAM-only Autonomous workflows for DC-IAC position control and Idle Closed Loop. "
                    "Includes live evidence capture, recommendation review, iteration history, comparison and rollback support. Autonomous operation uses bounded temporary RAM changes "
                    "with readback verification and restore handling. No automatic Burn.").encode()

          def patch_class(data,is_entry=False):
              cp_count=struct.unpack(">H",data[8:10])[0]
              pos=10
              out=bytearray(data[:10])
              i=1
              while i<cp_count:
                  tag=data[pos]
                  out.append(tag)
                  pos+=1
                  if tag==1:
                      ln=struct.unpack(">H",data[pos:pos+2])[0]
                      pos+=2
                      raw=data[pos:pos+ln]
                      pos+=ln
                      new=raw.replace(old_ver,new_ver)
                      if is_entry and new==old_desc:
                          new=new_desc
                      out.extend(struct.pack(">H",len(new)))
                      out.extend(new)
                  elif tag in (3,4):
                      out.extend(data[pos:pos+4]); pos+=4
                  elif tag in (5,6):
                      out.extend(data[pos:pos+8]); pos+=8; i+=1
                  elif tag in (7,8,16,19,20):
                      out.extend(data[pos:pos+2]); pos+=2
                  elif tag in (9,10,11,12,17,18):
                      out.extend(data[pos:pos+4]); pos+=4
                  elif tag==15:
                      out.extend(data[pos:pos+3]); pos+=3
                  else:
                      raise RuntimeError("Unknown constant-pool tag %s" % tag)
                  i+=1
              out.extend(data[pos:])
              return bytes(out)

          with zipfile.ZipFile(srcjar) as zin, zipfile.ZipFile(outjar,"w",compression=zipfile.ZIP_STORED) as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename.endswith(".class"):
                      data=patch_class(data,info.filename=="se/anders/tunerstudio/pidautotune/PidAutotunePlugin.class")
                  elif info.filename in (
                      "META-INF/MANIFEST.MF",
                      "META-INF/maven/se.anders.tunerstudio/pid-autotune-plugin/pom.xml",
                      "META-INF/maven/se.anders.tunerstudio/pid-autotune-plugin/pom.properties",
                  ):
                      data=data.replace(old_ver,new_ver)
                      if info.filename.endswith("/pom.xml"):
                          data=data.replace(
                              b"EPICEFI PID Tuner with task-based Guided and audited autonomous RAM-only workflows for Idle Closed Loop and DC-IAC. No automatic Burn.",
                              b"PID Tuner for EpicEFI/TunerStudio with task-based Guided and audited RAM-only workflows for Idle Closed Loop and DC-IAC. No automatic Burn."
                          )
                  ni=zipfile.ZipInfo(info.filename,(2026,9,11,6,0,0))
                  ni.compress_type=zipfile.ZIP_STORED
                  ni.comment=info.comment
                  ni.internal_attr=info.internal_attr
                  ni.external_attr=info.external_attr
                  ni.create_system=info.create_system
                  zout.writestr(ni,data)

          with zipfile.ZipFile(outjar) as z:
              for name in z.namelist():
                  data=z.read(name)
                  if old_ver in data or b"HARDENED-RC1" in data:
                      raise RuntimeError("Old RC identity remains in "+name)
                  if name.startswith("com/efiAnalytics") or "TunerStudioPluginAPI" in name:
                      raise RuntimeError("TunerStudio API content bundled in "+name)
          PY
          echo "$EXPECTED_SHA256  pid-autotune-plugin-0.5.24.jar" | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_SHA256" "pid-autotune-plugin-0.5.24.jar" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5.24 >/dev/null 2>&1; then
            gh release upload v0.5.24 pid-autotune-plugin-0.5.24.jar SHA256SUMS.txt --clobber
            gh release edit v0.5.24 --title "PID Tuner (EPICEFI) v0.5.24" --notes-file docs/RELEASE_0.5.24.md
          else
            gh release create v0.5.24 pid-autotune-plugin-0.5.24.jar SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "PID Tuner (EPICEFI) v0.5.24" \
              --notes-file docs/RELEASE_0.5.24.md
          fi
