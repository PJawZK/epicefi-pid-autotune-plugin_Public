name: Finalize v0.5.24 source tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v0.5.24-tag.yml"

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Point v0.5.24 at clean public source
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SOURCE_SHA: "6f69fbc2328bd5ad4d709106feef2ca70d6e19ac"
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.5.24" \
            -f sha="$CLEAN_SOURCE_SHA" \
            -F force=true
